{{define "header.html"}}
    <!-- Header -->
    <header class="border-b border-border bg-card/80 backdrop-blur sticky top-0 z-[100] w-full max-w-full">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap sm:flex-nowrap items-center justify-between gap-2">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20 shrink-0">
                    B
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-lg leading-none tracking-wide text-white flex items-center gap-2">
                        BFR WEBUI <span class="ml-2 px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] select-none shrink-0" style="background-color: #f59e0b !important; color: #000000 !important; border: 1.5px solid #000000 !important;">PRO</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-0.5 truncate max-w-[200px] sm:max-w-none" x-text="stats.model ? stats.model + ' (Android ' + stats.android_ver + ')' : 'Android System WebUI'"></p>
                </div>
            </div>

            <!-- Navigation Tabs (Desktop) -->
            {{template "sidebar.html" .}}

            <div class="flex items-center space-x-2 shrink-0">
                <button type="button" @click="showAppearanceModal = true" class="style-toggle px-3 py-1.5 text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all duration-100 select-none" title="Appearance & Theme Customization">
                    <span>🎨</span>
                    <span class="hidden sm:inline">Appearance</span>
                </button>
                <template x-if="authenticated">
                    <button type="button" @click="showBackupModal = true" class="px-2.5 py-1.5 text-xs font-extrabold text-gray-300 hover:text-white bg-flat border border-border/60 rounded-xl transition select-none" title="Backup & Settings">
                        ⚙️
                    </button>
                </template>
                <template x-if="authenticated">
                    <button type="button" @click="logout()" class="px-3.5 py-1.5 text-xs font-medium text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 rounded-xl transition">
                        Logout
                    </button>
                </template>
            </div>
        </div>
    </header>

    <!-- Mobile Fixed Bottom Category Bar (5-Column Grid Layout) -->
    <template x-if="authenticated">
        <div x-show="!hideMobileNav"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-4"
            class="grid grid-cols-5 w-full px-1 py-1.5 bg-card/85 backdrop-blur-xl border-t border-border/60 fixed bottom-0 left-0 right-0 z-50 md:hidden shadow-[0_-4px_20px_rgba(0,0,0,0.4)] font-mono text-xs select-none">
            
            <!-- Hide / Minimize Button Badge -->
            <button type="button" 
                @click="hideMobileNav = true; mobileCategory = null" 
                class="absolute -top-3.5 right-3 bg-card border border-border/80 text-gray-400 hover:text-white rounded-full px-2 py-0.5 text-[9px] font-bold shadow-lg z-50 flex items-center gap-0.5 select-none active:scale-95" 
                title="Minimize Nav Bar">
                <span>Hide</span>
                <span>✕</span>
            </button>

            <!-- 📊 Status Category -->
            <button type="button"
                @click="mobileCategory = (mobileCategory === 'status' ? null : 'status')"
                :class="['overview', 'sysinfo', 'logs'].includes(activeTab) || mobileCategory === 'status' ? 'text-blue-400 font-bold bg-blue-600/20 border-blue-500/40 shadow-sm shadow-blue-500/10' : 'text-gray-400 hover:text-gray-200 border-transparent'"
                class="flex flex-col items-center justify-center text-[10px] font-bold p-1 rounded-lg transition whitespace-nowrap active:scale-95 border">
                <span class="text-base">📊</span>
                <span class="text-[10px] mt-0.5">Status</span>
            </button>

            <!-- ⚙️ System Category -->
            <button type="button"
                @click="mobileCategory = (mobileCategory === 'system' ? null : 'system')"
                :class="['files', 'nas', 'terminal', 'tools'].includes(activeTab) || mobileCategory === 'system' ? 'text-blue-400 font-bold bg-blue-600/20 border-blue-500/40 shadow-sm shadow-blue-500/10' : 'text-gray-400 hover:text-gray-200 border-transparent'"
                class="flex flex-col items-center justify-center text-[10px] font-bold p-1 rounded-lg transition whitespace-nowrap active:scale-95 border">
                <span class="text-base">⚙️</span>
                <span class="text-[10px] mt-0.5">System</span>
            </button>

            <!-- 🛠️ Services Category -->
            <button type="button"
                @click="mobileCategory = (mobileCategory === 'services' ? null : 'services')"
                :class="['tools', 'scrcpy'].includes(activeTab) || mobileCategory === 'services' ? 'text-blue-400 font-bold bg-blue-600/20 border-blue-500/40 shadow-sm shadow-blue-500/10' : 'text-gray-400 hover:text-gray-200 border-transparent'"
                class="flex flex-col items-center justify-center text-[10px] font-bold p-1 rounded-lg transition whitespace-nowrap active:scale-95 border">
                <span class="text-base">🛠️</span>
                <span class="text-[10px] mt-0.5">Services</span>
            </button>

            <!-- 🌐 Network Category -->
            <button type="button"
                @click="mobileCategory = (mobileCategory === 'network' ? null : 'network')"
                :class="['network', 'qos', 'modem', 'tunnel', 'speedtest', 'proxy'].includes(activeTab) || mobileCategory === 'network' ? 'text-blue-400 font-bold bg-blue-600/20 border-blue-500/40 shadow-sm shadow-blue-500/10' : 'text-gray-400 hover:text-gray-200 border-transparent'"
                class="flex flex-col items-center justify-center text-[10px] font-bold p-1 rounded-lg transition whitespace-nowrap active:scale-95 border">
                <span class="text-base">🌐</span>
                <span class="text-[10px] mt-0.5">Network</span>
            </button>

            <!-- ⭐ Extras Category -->
            <button type="button"
                @click="mobileCategory = (mobileCategory === 'extras' ? null : 'extras')"
                :class="['sms', 'about'].includes(activeTab) || mobileCategory === 'extras' ? 'text-blue-400 font-bold bg-blue-600/20 border-blue-500/40 shadow-sm shadow-blue-500/10' : 'text-gray-400 hover:text-gray-200 border-transparent'"
                class="flex flex-col items-center justify-center text-[10px] font-bold p-1 rounded-lg transition whitespace-nowrap active:scale-95 border">
                <span class="text-base">⭐</span>
                <span class="text-[10px] mt-0.5">Extras</span>
            </button>
        </div>
    </template>

    <!-- Floating Pill Button when Mobile Nav is Hidden -->
    <template x-if="authenticated">
        <button type="button"
            x-show="hideMobileNav"
            @click="hideMobileNav = false"
            x-cloak
            class="fixed bottom-4 left-4 z-[90] md:hidden bg-card/90 backdrop-blur-xl border border-blue-500/50 rounded-full px-3.5 py-2 shadow-2xl text-xs font-bold text-blue-400 flex items-center gap-1.5 active:scale-95 transition">
            <span>🧭 Nav</span>
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
        </button>
    </template>
{{end}}
