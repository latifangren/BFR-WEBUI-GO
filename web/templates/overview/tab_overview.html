{{define "tab_overview.html"}}
                <!-- TAB 1: OVERVIEW -->
                <div x-show="activeTab === 'overview'" class="space-y-6">
                    <!-- Stat Gauges -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <!-- CPU Gauge (Clickable to open per-core modal) -->
                        <div @click="showCpuModal = true" class="bg-card border border-border hover:border-blue-500/50 rounded-2xl p-5 flex flex-col justify-between cursor-pointer transition group shadow-sm hover:shadow-blue-500/10">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <div class="flex items-center space-x-1.5">
                                    <span class="text-xs font-bold uppercase tracking-wider group-hover:text-blue-400 transition">CPU Load</span>
                                    <span class="text-[9px] font-mono text-blue-400 bg-blue-500/10 border border-blue-500/20 px-1.5 py-0.5 rounded font-bold">Cores ↗</span>
                                </div>
                                <div class="flex items-center space-x-1.5 font-mono text-[10px]">
                                    <span class="text-blue-400" x-text="stats.cpu_cores ? stats.cpu_cores.length + ' Cores' : ''"></span>
                                    <template x-if="stats.cpu_temp > 0">
                                        <span class="text-amber-400 font-bold bg-amber-500/10 border border-amber-500/20 px-1.5 py-0.5 rounded" x-text="stats.cpu_temp.toFixed(1) + '°C'"></span>
                                    </template>
                                </div>
                            </div>
                            <div class="flex items-baseline justify-between select-none">
                                <span class="text-4xl font-extrabold text-white" x-text="stats.cpu_usage ? stats.cpu_usage.toFixed(1) + '%' : '0%'"></span>
                                <template x-if="stats.load_avg">
                                    <div class="flex flex-col text-[9px] font-mono text-cyan-400 text-right leading-tight">
                                        <span>1m: <span class="font-extrabold text-white" x-text="stats.load_avg.load1.toFixed(2)"></span></span>
                                        <span>5m: <span class="font-extrabold text-white" x-text="stats.load_avg.load5.toFixed(2)"></span></span>
                                        <span>15m: <span class="font-extrabold text-white" x-text="stats.load_avg.load15.toFixed(2)"></span></span>
                                    </div>
                                </template>
                            </div>
                            <div class="w-full bg-flat rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-blue-500 h-2 rounded-full transition-all duration-500" :style="'width: ' + (stats.cpu_usage || 0) + '%'"></div>
                            </div>
                        </div>

                        <!-- RAM Gauge -->
                        <div class="bg-card border border-border rounded-2xl p-5 flex flex-col justify-between">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider">RAM Usage</span>
                                <span class="text-xs font-mono text-purple-400" x-text="formatBytes(stats.mem_used) + ' / ' + formatBytes(stats.mem_total)"></span>
                            </div>
                            <div class="flex items-baseline space-x-2">
                                <span class="text-4xl font-extrabold text-white" x-text="stats.mem_used_pct ? stats.mem_used_pct.toFixed(1) + '%' : '0%'"></span>
                            </div>
                            <!-- Swap/ZRAM box inline info -->
                            <template x-if="stats.swap_total > 0">
                                <div class="text-[9px] font-mono text-gray-400 tracking-wider flex justify-between mt-2">
                                    <span>SWAP/ZRAM:</span>
                                    <span class="text-purple-300 font-bold" x-text="formatBytes(stats.swap_used) + ' / ' + formatBytes(stats.swap_total) + ' (' + stats.swap_used_pct.toFixed(1) + '%)'"></span>
                                </div>
                            </template>
                            <div class="w-full bg-flat rounded-full h-2 mt-2 overflow-hidden">
                                <div class="bg-purple-500 h-2 rounded-full transition-all duration-500" :style="'width: ' + (stats.mem_used_pct || 0) + '%'"></div>
                            </div>
                        </div>

                        <!-- Internal Storage Gauge -->
                        <div class="bg-card border border-border rounded-2xl p-5 flex flex-col justify-between">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider">Storage</span>
                                <span class="text-xs font-mono text-emerald-400" x-text="formatBytes(stats.disk_used) + ' / ' + formatBytes(stats.disk_total)"></span>
                            </div>
                            <div class="flex items-baseline space-x-2">
                                <span class="text-4xl font-extrabold text-white" x-text="stats.disk_used_pct ? stats.disk_used_pct.toFixed(1) + '%' : '0%'"></span>
                            </div>
                            <div class="w-full bg-flat rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-emerald-500 h-2 rounded-full transition-all duration-500" :style="'width: ' + (stats.disk_used_pct || 0) + '%'"></div>
                            </div>
                        </div>

                        <!-- Battery Gauge (Clickable modal) -->
                        <div @click="showBatteryModal = true" class="bg-card border border-border hover:border-amber-500/50 rounded-2xl p-5 flex flex-col justify-between cursor-pointer transition group shadow-sm hover:shadow-amber-500/10">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <div class="flex items-center space-x-1.5">
                                    <span class="text-xs font-bold uppercase tracking-wider group-hover:text-amber-400 transition">Battery</span>
                                    <span class="text-[9px] font-mono text-amber-400 bg-amber-500/10 border border-amber-500/20 px-1.5 py-0.5 rounded font-bold">Details ↗</span>
                                </div>
                                <div class="flex items-center space-x-1 font-mono text-[10px]">
                                    <span class="text-amber-400 font-bold" x-text="stats.battery_level + '%'"></span>
                                    <template x-if="stats.battery_status">
                                        <span class="text-gray-400" x-text="'(' + stats.battery_status + ')'"></span>
                                    </template>
                                </div>
                            </div>
                            <div class="flex items-baseline justify-between select-none">
                                <span class="text-4xl font-extrabold text-white" x-text="stats.battery_level + '%'"></span>
                                <template x-if="stats.battery_temp > 0">
                                    <div class="text-[10px] font-mono text-amber-400 text-right">
                                        <span class="font-bold" x-text="stats.battery_temp.toFixed(1) + '°C'"></span>
                                    </div>
                                </template>
                            </div>
                            <div class="w-full bg-flat rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-amber-500 h-2 rounded-full transition-all duration-500" :style="'width: ' + (stats.battery_level || 0) + '%'"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Custom App Dashboard Shortcuts (CasaOS Style) -->
                    <div class="bg-card border border-border rounded-2xl p-6 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-border/40 pb-3">
                            <div>
                                <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                                    <span>🚀 Application Dashboard Shortcuts</span>
                                </h3>
                                <p class="text-xs text-gray-400 font-mono mt-0.5">Quick launcher for local services & external URLs</p>
                            </div>
                            <button type="button" @click="openAddShortcutModal()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-blue-500/20 active:scale-95 select-none">
                                <span>+ Add External Link</span>
                            </button>
                        </div>

                        <!-- Grid of Shortcuts -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                            <template x-for="item in shortcuts" :key="item.id">
                                <div class="bg-black/80 hover:bg-black border border-border/80 hover:border-blue-500/50 rounded-xl p-3.5 flex flex-col justify-between transition group relative shadow-md">
                                    <!-- Action options menu (Edit / Delete) -->
                                    <div class="absolute top-2 right-2 flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition z-10">
                                        <button type="button" @click.stop="openEditShortcutModal(item)" class="p-1 text-gray-400 hover:text-blue-400 text-[10px] bg-card border border-border rounded-md select-none" title="Edit Shortcut">✏️</button>
                                        <button type="button" @click.stop="deleteShortcutItem(item.id)" class="p-1 text-gray-400 hover:text-red-400 text-[10px] bg-card border border-border rounded-md select-none" title="Delete Shortcut">🗑️</button>
                                    </div>

                                    <a :href="item.url" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center text-center space-y-2.5 pt-1 select-none">
                                        <!-- Custom Icon or Fallback App Icon -->
                                        <template x-if="item.icon_url">
                                            <img :src="item.icon_url" :alt="item.title" class="w-10 h-10 object-contain rounded-lg shadow-md group-hover:scale-105 transition" />
                                        </template>
                                        <template x-if="!item.icon_url">
                                            <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 font-extrabold text-lg shadow-inner group-hover:scale-105 transition">
                                                🌐
                                            </div>
                                        </template>

                                        <div class="w-full">
                                            <div class="text-xs font-bold text-white group-hover:text-blue-400 transition truncate" x-text="item.title"></div>
                                            <div class="text-[9px] text-gray-500 font-mono truncate mt-0.5" x-text="item.url"></div>
                                        </div>
                                    </a>
                                </div>
                            </template>

                            <!-- Empty State Card -->
                            <template x-if="!shortcuts || shortcuts.length === 0">
                                <div class="col-span-full py-8 text-center bg-black/40 border border-dashed border-border/60 rounded-xl space-y-2 select-none">
                                    <div class="text-2xl">🔗</div>
                                    <div class="text-xs font-bold text-gray-300">No application shortcuts added yet</div>
                                    <p class="text-[10px] text-gray-500 font-mono">Click "+ Add External Link" above to customize your dashboard links.</p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Active Services Status List (eZ Monitor Style) -->
                    <template x-if="stats.active_services && stats.active_services.length > 0">
                        <div class="bg-card border border-border rounded-2xl p-6 space-y-4">
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Active Background Services</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                <template x-for="service in stats.active_services" :key="service.key">
                                    <div class="bg-flat p-4 rounded-xl flex items-center justify-between font-mono">
                                        <div class="space-y-1">
                                            <div class="text-xs font-bold text-white" x-text="service.name"></div>
                                            <div class="text-[10px] text-gray-500" x-text="service.detail"></div>
                                        </div>
                                        <div>
                                            <span class="px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-wider"
                                                :class="service.running ? 'badge-active' : 'badge-inactive'"
                                                x-text="service.running ? 'Active' : 'Stopped'">
                                            </span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Quick Power Actions -->
                    <div class="bg-card border border-border rounded-2xl p-6 space-y-4">
                        <div>
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Quick Power Actions</h3>
                            <p class="text-xs text-gray-400 font-mono">Trigger Magisk / Root System Operations</p>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                            <button type="button" @click="confirmPower('reboot', 'Reboot Device')" class="p-4 bg-black hover:bg-gray-900 border border-border rounded-xl flex flex-col items-center transition group">
                                <span class="text-xs font-semibold text-gray-200">Reboot</span>
                            </button>
                            <button type="button" @click="confirmPower('soft_reboot', 'Soft Reboot')" class="p-4 bg-black hover:bg-gray-900 border border-border rounded-xl flex flex-col items-center transition group">
                                <span class="text-xs font-semibold text-gray-200">Soft Reboot</span>
                            </button>
                            <button type="button" @click="confirmPower('recovery', 'Recovery')" class="p-4 bg-black hover:bg-gray-900 border border-border rounded-xl flex flex-col items-center transition group">
                                <span class="text-xs font-semibold text-gray-200">Recovery</span>
                            </button>
                            <button type="button" @click="confirmPower('bootloader', 'Bootloader')" class="p-4 bg-black hover:bg-gray-900 border border-border rounded-xl flex flex-col items-center transition group">
                                <span class="text-xs font-semibold text-gray-200">Bootloader</span>
                            </button>
                            <button type="button" @click="confirmPower('poweroff', 'Shutdown')" class="p-4 bg-black hover:bg-gray-900 border border-border rounded-xl flex flex-col items-center transition group">
                                <span class="text-xs font-semibold text-red-400">Power Off</span>
                            </button>
                        </div>
                    </div>
                </div>
{{end}}
