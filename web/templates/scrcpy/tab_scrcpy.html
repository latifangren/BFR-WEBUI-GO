{{define "tab_scrcpy.html"}}
                <!-- TAB 8: REMOTE SCREEN (SCRCPY) -->
                <div x-show="activeTab === 'scrcpy'" class="space-y-6">
                    <div class="bg-card border border-border rounded-2xl p-6 space-y-5">
                        <!-- Top Toolbar / Header & Controls -->
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <div>
                                <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono flex items-center gap-2">
                                    <span>Web Screen Mirroring & Touch Controller</span>
                                    <span class="text-[10px] px-2 py-0.5 font-bold font-mono tracking-wider uppercase"
                                        :class="isMirroring ? 'badge-info' : 'badge-neutral'"
                                        x-text="isMirroring ? screenRate + ' FPS' : 'Disconnected'"></span>
                                </h3>
                                <p class="text-xs text-gray-400 font-mono">Real-time device display frame stream with touch & key injection</p>
                            </div>
                            <div class="flex items-center space-x-2 font-mono">
                                <button type="button" @click="isMirroring ? stopMirroring() : startMirroring()"
                                    :class="isMirroring ? 'bg-red-600 hover:bg-red-500' : 'bg-green-600 hover:bg-green-500'"
                                    class="px-4 py-2 rounded-xl text-xs font-bold text-white transition">
                                    <span x-text="isMirroring ? 'Stop Stream' : 'Start Mirroring'"></span>
                                </button>
                            </div>
                        </div>

                        <!-- Canvas Display Container -->
                        <div class="flex flex-col items-center justify-center space-y-4">
                            <div class="bg-black border-2 border-border rounded-2xl overflow-hidden relative shadow-2xl flex items-center justify-center min-h-[400px] max-w-sm w-full select-none cursor-crosshair">
                                <template x-if="scrcpyImgUrl">
                                    <img :src="scrcpyImgUrl"
                                        @click="handleScreenClick($event)"
                                        @touchstart="handleScreenTouchStart($event)"
                                        @touchend="handleScreenTouchEnd($event)"
                                        class="w-full h-auto object-contain block max-h-[600px] touch-none"
                                        alt="Android Screen Stream" />
                                </template>
                                <template x-if="!scrcpyImgUrl">
                                    <div class="p-8 text-center space-y-3 font-mono">
                                        <div class="w-12 h-12 rounded-2xl bg-gray-900 border border-border mx-auto flex items-center justify-center text-gray-500 font-bold">
                                            📱
                                        </div>
                                        <div class="text-xs text-gray-400 font-semibold">Screen Stream Stopped</div>
                                        <button type="button" @click="startMirroring()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">
                                            Connect Screen
                                        </button>
                                    </div>
                                </template>
                            </div>

                            <!-- Hardware Control Buttons -->
                            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 max-w-md w-full font-mono text-xs">
                                <button type="button" @click="sendKey('back')" class="p-2.5 bg-black hover:bg-gray-900 border border-border rounded-xl font-bold text-gray-200 transition">
                                    ◀ Back
                                </button>
                                <button type="button" @click="sendKey('home')" class="p-2.5 bg-black hover:bg-gray-900 border border-border rounded-xl font-bold text-gray-200 transition">
                                    ● Home
                                </button>
                                <button type="button" @click="sendKey('recents')" class="p-2.5 bg-black hover:bg-gray-900 border border-border rounded-xl font-bold text-gray-200 transition">
                                    ■ Recents
                                </button>
                                <button type="button" @click="sendKey('vol_up')" class="p-2.5 bg-black hover:bg-gray-950 border border-border rounded-xl font-bold text-gray-200 transition">
                                    🔊 Vol +
                                </button>
                                <button type="button" @click="sendKey('vol_down')" class="p-2.5 bg-black hover:bg-gray-950 border border-border rounded-xl font-bold text-gray-200 transition">
                                    🔉 Vol -
                                </button>
                            </div>

                            <!-- Text Input Injection Box -->
                            <form @submit.prevent="sendScrcpyText()" class="flex items-center gap-2 max-w-md w-full font-mono">
                                <label for="scrcpy-text-input" class="sr-only">Input text to send to device</label>
                                <input id="scrcpy-text-input" type="text" x-model="scrcpyTextInput" placeholder="Type text to send to device..." class="flex-1 bg-black border border-border rounded-xl px-3.5 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500" />
                                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">
                                    Send Text
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
{{end}}
