{{define "tab_filemanager.html"}}
                <!-- TAB 6: FILE MANAGER -->
                <div x-show="activeTab === 'files'" class="space-y-6">
                    <div class="bg-card border border-border rounded-2xl p-6 space-y-4">
                        <!-- Top Toolbar & Breadcrumbs -->
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <!-- Breadcrumb Path -->
                            <div class="flex items-center space-x-1 overflow-x-auto text-xs font-mono bg-black border border-border px-3 py-2 rounded-xl custom-scrollbar flex-1">
                                <span @click="fetchFileList('/')" class="text-blue-500 hover:underline cursor-pointer font-semibold">root</span>
                                <template x-for="(segment, idx) in currentPathSegments" :key="idx">
                                    <div class="flex items-center space-x-1">
                                        <span class="text-gray-600">/</span>
                                        <span @click="navigateBreadcrumb(idx)" class="text-blue-500 hover:underline cursor-pointer font-semibold" x-text="segment"></span>
                                    </div>
                                </template>
                            </div>

                            <!-- Actions -->
                            <div class="flex items-center space-x-2">
                                <button type="button" @click="openCreateFileModal()" class="px-3 py-1.5 bg-black hover:bg-gray-900 border border-border text-xs text-gray-200 rounded-xl flex items-center gap-1 font-semibold">
                                    + New File
                                </button>
                                <button type="button" @click="openCreateDirModal()" class="px-3 py-1.5 bg-black hover:bg-gray-900 border border-border text-xs text-gray-200 rounded-xl flex items-center gap-1 font-semibold">
                                    + New Folder
                                </button>
                                <button type="button" @click="showUploadModal = true" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">
                                    Upload
                                </button>
                            </div>
                        </div>

                        <!-- Quick Path Shortcuts -->
                        <div class="flex flex-wrap items-center gap-2 text-xs font-mono select-none">
                            <span class="text-gray-500 font-bold uppercase text-[10px]">Shortcuts:</span>
                            <template x-for="(sc, index) in fileManagerShortcuts" :key="index">
                                <div class="inline-flex items-center bg-black border border-border rounded px-2.5 py-1 gap-1.5 shadow-[2px_2px_0px_0px_var(--neo-shadow)] transition hover:-translate-y-0.5">
                                    <span @click="fetchFileList(sc.path)" class="text-blue-500 hover:underline cursor-pointer font-semibold" x-text="sc.name"></span>
                                    <span @click="removeShortcut(index)" class="text-red-500 hover:text-red-650 cursor-pointer font-extrabold text-[12px] ml-0.5" title="Remove bookmark">×</span>
                                </div>
                            </template>
                            <button type="button" @click="openAddShortcutModal()" class="px-2.5 py-1.5 bg-blue-600/10 hover:bg-blue-600/20 text-blue-500 border border-blue-500/30 rounded-xl text-[10px] font-bold transition flex items-center gap-0.5 uppercase tracking-wide">
                                + Add Shortcut
                            </button>
                        </div>

                        <!-- Directory Listing Table -->
                        <div class="relative"
                             @dragover.prevent="isDragging = true"
                             @dragleave.prevent="isDragging = false"
                             @drop.prevent="handleFileDrop($event)">
                            <div x-show="isDragging" x-cloak class="absolute inset-0 bg-blue-600/20 backdrop-blur-sm border-2 border-dashed border-blue-550 rounded-xl z-30 flex items-center justify-center pointer-events-none">
                                <div class="bg-[#1e293b] border-2 border-border p-4 rounded-xl shadow-2xl flex items-center gap-2 text-xs font-mono font-bold text-white select-none">
                                    <span>📥</span>
                                    <span>Drop files here to upload to current directory</span>
                                </div>
                            </div>
                            <div class="bg-black border border-border rounded-xl overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-xs font-mono">
                                    <thead class="bg-gray-900/50 text-gray-400 border-b border-border">
                                        <tr>
                                            <th class="p-3">Name</th>
                                            <th class="p-3">Size</th>
                                            <th class="p-3">Permissions</th>
                                            <th class="p-3 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-border/50 text-gray-300">
                                        <template x-for="file in fileList" :key="file.path">
                                            <tr class="hover:bg-card/50 transition">
                                                <td class="p-3">
                                                    <div class="flex items-center space-x-2">
                                                        <span x-text="file.is_dir ? '📁' : '📄'"></span>
                                                         <template x-if="file.is_dir">
                                                             <span @click="fetchFileList(file.path)" class="text-blue-500 hover:underline cursor-pointer font-bold" x-text="file.name"></span>
                                                         </template>
                                                         <template x-if="!file.is_dir">
                                                             <span class="text-white font-medium" x-text="file.name"></span>
                                                         </template>
                                                     </div>
                                                 </td>
                                                 <td class="p-3 text-gray-400" x-text="file.is_dir ? '-' : formatBytes(file.size)"></td>
                                                 <td class="p-3 text-gray-400" x-text="file.permissions"></td>
                                                  <td class="p-3 text-right space-x-3 select-none">
                                                      <template x-if="!file.is_parent">
                                                          <span @click="openRenameModal(file)" class="text-amber-500 hover:underline cursor-pointer font-bold text-xs">RENAME</span>
                                                      </template>
                                                      <template x-if="!file.is_dir && !file.is_parent">
                                                          <span @click="openEditor(file.path)" class="text-blue-500 hover:underline cursor-pointer font-bold text-xs">EDIT</span>
                                                      </template>
                                                      <template x-if="!file.is_dir && !file.is_parent">
                                                          <span @click="window.open('/api/files/download?path=' + encodeURIComponent(file.path), '_blank')" class="text-green-500 hover:underline cursor-pointer font-bold text-xs">DOWNLOAD</span>
                                                      </template>
                                                      <template x-if="!file.is_parent">
                                                          <span @click="deletePath(file.path)" class="text-red-500 hover:underline cursor-pointer font-bold text-xs">DELETE</span>
                                                      </template>
                                                      <template x-if="file.is_parent">
                                                          <span class="text-gray-500 font-bold text-xs">-</span>
                                                      </template>
                                                  </td>
                                            </tr>
                                         </template>
                                     </tbody>
                                 </table>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
{{end}}
