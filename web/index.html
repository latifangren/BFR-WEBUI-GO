<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFR WEBUI GO</title>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
        } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        }
    </script>
    <link rel="stylesheet" href="/static/css/tailwind.min.css" />
    <link rel="stylesheet" href="/static/css/xterm.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script defer src="/static/js/alpine.min.js"></script>
    <script src="/static/js/xterm.js"></script>
    <script src="/static/js/xterm-addon-fit.js"></script>
</head>
<body class="bg-amoled text-gray-200 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white"
      x-data="dashboard()" x-init="init()">

    <!-- Header -->
    <header class="border-b border-border bg-card/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20">
                    B
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none tracking-wide text-white flex items-center gap-2">
                        BFR WEBUI <span class="ml-2 px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]" style="background-color: #f59e0b !important; color: #000000 !important; border: 1.5px solid #000000 !important;">PRO</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-0.5" x-text="stats.model ? stats.model + ' (Android ' + stats.android_ver + ')' : 'Android System WebUI'"></p>
                </div>
            </div>

            <!-- Navigation Tabs (Desktop) -->
            <template x-if="authenticated">
                <nav class="hidden md:flex items-center space-x-1 bg-black p-1 rounded-xl border border-border">
                    <button type="button" @click="activeTab = 'overview'" :class="activeTab === 'overview' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        Overview
                    </button>
                    <button type="button" @click="activeTab = 'network'" :class="activeTab === 'network' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        Network & Tweaks
                    </button>
                    <button type="button" @click="activeTab = 'proxy'" :class="activeTab === 'proxy' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        Proxy Core
                    </button>
                    <button type="button" @click="activeTab = 'files'; fetchFileList(currentPath)" :class="activeTab === 'files' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        File Manager
                    </button>
                    <button type="button" @click="activeTab = 'terminal'; initTerminal()" :class="activeTab === 'terminal' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        Web Terminal
                    </button>
                    <button type="button" @click="activeTab = 'tools'" :class="activeTab === 'tools' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        System Tools
                    </button>
                    <button type="button" @click="activeTab = 'sms'; fetchSMS()" :class="activeTab === 'sms' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        SMS Viewer
                    </button>
                    <button type="button" @click="activeTab = 'scrcpy'" :class="activeTab === 'scrcpy' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        Remote Screen
                    </button>
                    <button type="button" @click="activeTab = 'sysinfo'" :class="activeTab === 'sysinfo' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        System Info
                    </button>
                    <button type="button" @click="activeTab = 'about'" :class="activeTab === 'about' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
                        About
                    </button>
                </nav>
            </template>

            <div class="flex items-center space-x-3">
                <button type="button" @click="toggleTheme()" class="theme-toggle px-2.5 py-1.5 text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all duration-100 select-none">
                    <span x-show="isDark">🌙</span>
                    <span x-show="!isDark">☀️</span>
                    <span x-text="isDark ? 'Dark' : 'Light'"></span>
                </button>
                <template x-if="authenticated">
                    <button type="button" @click="logout()" class="px-3.5 py-1.5 text-xs font-medium text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 rounded-xl transition">
                        Logout
                    </button>
                </template>
            </div>
        </div>

        <!-- Navigation Tabs (Mobile) -->
        <template x-if="authenticated">
            <div class="md:hidden flex items-center overflow-x-auto px-4 py-2 border-t border-border space-x-2 custom-scrollbar">
                <button type="button" @click="activeTab = 'overview'" :class="activeTab === 'overview' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Overview</button>
                <button type="button" @click="activeTab = 'network'" :class="activeTab === 'network' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Network</button>
                <button type="button" @click="activeTab = 'proxy'" :class="activeTab === 'proxy' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Proxy Core</button>
                <button type="button" @click="activeTab = 'files'; fetchFileList(currentPath)" :class="activeTab === 'files' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Files</button>
                <button type="button" @click="activeTab = 'terminal'; initTerminal()" :class="activeTab === 'terminal' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Terminal</button>
                <button type="button" @click="activeTab = 'tools'" :class="activeTab === 'tools' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Tools</button>
                <button type="button" @click="activeTab = 'sms'; fetchSMS()" :class="activeTab === 'sms' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">SMS Viewer</button>
                <button type="button" @click="activeTab = 'scrcpy'" :class="activeTab === 'scrcpy' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Remote Screen</button>
                <button type="button" @click="activeTab = 'sysinfo'" :class="activeTab === 'sysinfo' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">System Info</button>
                <button type="button" @click="activeTab = 'about'" :class="activeTab === 'about' ? 'bg-blue-600 text-white' : 'text-gray-400 bg-card border border-border'" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">About</button>
            </div>
        </template>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <!-- Auth Modal/Form -->
        <template x-if="!authenticated">
            <div class="max-w-md mx-auto my-16 bg-card border border-border rounded-3xl p-8 shadow-2xl space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-12 h-12 rounded-2xl bg-blue-600 mx-auto flex items-center justify-center font-bold text-xl text-white shadow-xl shadow-blue-500/20">B</div>
                    <h2 class="text-2xl font-extrabold text-white">BFR WebUI Authentication</h2>
                    <p class="text-xs text-gray-400">High-performance Android System WebUI & Control Panel</p>
                </div>
                <form @submit.prevent="login()" class="space-y-4">
                    <div>
                        <label for="pwd" class="block text-xs font-medium text-gray-400 mb-1">Access Password</label>
                        <input id="pwd" type="password" x-model="loginPassword" class="w-full bg-black border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition placeholder-gray-600 font-mono" placeholder="Default: bfr" required />
                    </div>
                    <template x-if="authError">
                        <p class="text-xs text-red-400 font-medium" x-text="authError"></p>
                    </template>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
                        Sign In
                    </button>
                </form>
            </div>
        </template>

        <template x-if="authenticated">
            <div class="space-y-6">
                <!-- TAB 1: OVERVIEW -->
                <div x-show="activeTab === 'overview'" class="space-y-6">
                    <!-- Stat Gauges -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <!-- CPU Gauge -->
                        <div class="bg-card border border-border rounded-2xl p-5 flex flex-col justify-between">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider">CPU Load</span>
                                <span class="text-xs font-mono text-blue-400" x-text="stats.cpu_cores ? stats.cpu_cores.length + ' Cores' : ''"></span>
                            </div>
                            <div class="flex items-baseline justify-between select-none">
                                <span class="text-4xl font-extrabold text-white" x-text="stats.cpu_usage ? stats.cpu_usage.toFixed(1) + '%' : '0%'"></span>
                                <template x-if="stats.load_avg">
                                    <div class="flex flex-col text-[9px] font-mono text-cyan-400 text-right leading-tight">
                                        <span>1m: <span class="font-extrabold text-white" x-text="stats.load_avg.load1.toFixed(2)"></span></span>
                                        <span>5m: <span class="font-extrabold text-white" x-text="stats.load_avg.load5.toFixed(2)"></span></span>
                                        <span>15m: <span class="font-extrabold text-white" x-text="stats.load_avg.load15.toFixed(2)"></span></span>
                                    </div>
                                </template>
                            </div>
                            <div class="w-full bg-flat rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-blue-500 h-2 rounded-full transition-all duration-500" :style="'width: ' + (stats.cpu_usage || 0) + '%'"></div>
                            </div>
                        </div>

                        <!-- RAM Gauge -->
                        <div class="bg-card border border-border rounded-2xl p-5 flex flex-col justify-between">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider">RAM Usage</span>
                                <span class="text-xs font-mono text-purple-400" x-text="formatBytes(stats.mem_used) + ' / ' + formatBytes(stats.mem_total)"></span>
                            </div>
                            <div class="flex items-baseline space-x-2">
                                <span class="text-4xl font-extrabold text-white" x-text="stats.mem_used_pct ? stats.mem_used_pct.toFixed(1) + '%' : '0%'"></span>
                            </div>
                            <!-- Swap/ZRAM box inline info -->
                            <template x-if="stats.swap_total > 0">
                                <div class="text-[9px] font-mono text-gray-400 tracking-wider flex justify-between mt-2">
                                    <span>SWAP/ZRAM:</span>
                                    <span class="text-purple-300 font-bold" x-text="formatBytes(stats.swap_used) + ' / ' + formatBytes(stats.swap_total) + ' (' + stats.swap_used_pct.toFixed(1) + '%)'"></span>
                                </div>
                            </template>
                            <div class="w-full bg-flat rounded-full h-2 mt-2 overflow-hidden">
                                <div class="bg-purple-500 h-2 rounded-full transition-all duration-500" :style="'width: ' + (stats.mem_used_pct || 0) + '%'"></div>
                            </div>
                        </div>

                        <!-- Battery Gauge -->
                        <div class="bg-card border border-border rounded-2xl p-5 flex flex-col justify-between">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider">Battery</span>
                                <span class="text-xs font-mono text-green-400" x-text="stats.battery_detail ? stats.battery_detail.status : ''"></span>
                            </div>
                            <div class="flex items-baseline justify-between">
                                <span class="text-4xl font-extrabold text-white" x-text="stats.battery_level >= 0 ? stats.battery_level + '%' : 'N/A'"></span>
                                <span class="text-xs text-gray-400 font-mono" x-text="stats.battery_temp ? stats.battery_temp.toFixed(1) + '°C' : ''"></span>
                            </div>
                            <div class="w-full bg-flat rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-green-500 h-2 rounded-full transition-all duration-500" :style="'width: ' + (stats.battery_level || 0) + '%'"></div>
                            </div>
                        </div>

                        <!-- Uptime & System -->
                        <div class="bg-card border border-border rounded-2xl p-5 flex flex-col justify-between">
                            <div class="flex items-center justify-between text-gray-400 mb-3">
                                <span class="text-xs font-bold uppercase tracking-wider">Uptime</span>
                                <span class="text-xs font-mono text-amber-400" x-text="stats.model || 'Android'"></span>
                            </div>
                            <div class="flex items-baseline space-x-2">
                                <span class="text-2xl font-bold text-white font-mono" x-text="formatUptime(stats.uptime)"></span>
                            </div>
                            <div class="w-full bg-flat rounded-full h-2 mt-4 overflow-hidden">
                                <div class="bg-amber-500 h-2 rounded-full transition-all duration-500" style="width: 100%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- CPU Core Frequencies -->
                    <template x-if="stats.cpu_cores && stats.cpu_cores.length > 0">
                        <div class="bg-card border border-border rounded-2xl p-6 space-y-4">
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Per-Core Frequencies & Load</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                                <template x-for="core in stats.cpu_cores" :key="core.core">
                                    <div class="bg-flat p-3 rounded-xl text-center space-y-1">
                                        <div class="text-[10px] uppercase font-bold text-gray-500" x-text="'Core ' + core.core"></div>
                                        <div class="text-sm font-extrabold text-blue-400 font-mono" x-text="core.freq_mhz > 0 ? core.freq_mhz.toFixed(0) + ' MHz' : 'Idle'"></div>
                                        <div class="text-xs text-gray-300 font-mono" x-text="core.usage.toFixed(0) + '%'"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Active Services Status List (eZ Monitor Style) -->
                    <template x-if="stats.active_services && stats.active_services.length > 0">
                        <div class="bg-card border border-border rounded-2xl p-6 space-y-4">
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Active Background Services</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                <template x-for="service in stats.active_services" :key="service.key">
                                    <div class="bg-flat p-4 rounded-xl flex items-center justify-between font-mono">
                                        <div class="space-y-1">
                                            <div class="text-xs font-bold text-white" x-text="service.name"></div>
                                            <div class="text-[10px] text-gray-500" x-text="service.detail"></div>
                                        </div>
                                         <div>
                                             <span class="px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-wider"
                                                 :class="service.running ? 'badge-active' : 'badge-inactive'"
                                                 x-text="service.running ? 'Active' : 'Stopped'">
                                             </span>
                                         </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Bandwidth & Quota Monitor (vnstat) -->
                    <div class="bg-card border border-border rounded-2xl p-6 space-y-5">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <div>
                                <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono flex items-center gap-2">
                                    <span>Bandwidth & Quota Monitor</span>
                                    <span class="text-[10px] px-2 py-0.5 font-mono badge-info">vnstat</span>
                                </h3>
                                <p class="text-xs text-gray-400 font-mono">Persistent daily & monthly network traffic statistics</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button type="button" @click="fetchVnstatData()" class="px-3 py-1.5 bg-black hover:bg-gray-900 border border-border text-xs text-gray-300 hover:text-white rounded-xl font-mono font-semibold transition">
                                    Refresh
                                </button>
                                 <button type="button" @click="showConfirm('Reset Traffic Stats', 'Are you sure you want to reset all daily and monthly bandwidth usage data? This action cannot be undone.', () => resetVnstatData())" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 rounded-xl text-xs font-mono font-bold transition">
                                    Reset Stats
                                </button>
                            </div>
                        </div>

                        <!-- Summary Cards Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Today's Usage Card -->
                            <div class="bg-flat rounded-xl p-4 space-y-3">
                                <div class="flex items-center justify-between text-xs font-mono border-b border-border/60 pb-2">
                                    <span class="font-bold text-gray-300 uppercase">Today's Usage</span>
                                    <span class="text-blue-400 font-extrabold" x-text="formatBytes(vnstatData?.daily?.total?.total || 0)"></span>
                                </div>
                                <div class="grid grid-cols-3 gap-2 text-center font-mono">
                                    <div class="bg-card/50 p-2.5 rounded-lg">
                                        <div class="text-[10px] text-gray-500 uppercase font-bold">Download</div>
                                        <div class="text-xs font-bold text-green-400 mt-1" x-text="formatBytes(vnstatData?.daily?.total?.rx_bytes || 0)"></div>
                                    </div>
                                    <div class="bg-card/50 p-2.5 rounded-lg">
                                        <div class="text-[10px] text-gray-500 uppercase font-bold">Upload</div>
                                        <div class="text-xs font-bold text-purple-400 mt-1" x-text="formatBytes(vnstatData?.daily?.total?.tx_bytes || 0)"></div>
                                    </div>
                                    <div class="bg-card/50 p-2.5 rounded-lg">
                                        <div class="text-[10px] text-gray-500 uppercase font-bold">Total</div>
                                        <div class="text-xs font-extrabold text-white mt-1" x-text="formatBytes(vnstatData?.daily?.total?.total || 0)"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- This Month's Usage Card -->
                            <div class="bg-flat rounded-xl p-4 space-y-3">
                                <div class="flex items-center justify-between text-xs font-mono border-b border-border/60 pb-2">
                                    <span class="font-bold text-gray-300 uppercase">This Month's Usage</span>
                                    <span class="text-amber-400 font-extrabold" x-text="formatBytes(vnstatData?.monthly?.total?.total || 0)"></span>
                                </div>
                                <div class="grid grid-cols-3 gap-2 text-center font-mono">
                                    <div class="bg-card/50 p-2.5 rounded-lg">
                                        <div class="text-[10px] text-gray-500 uppercase font-bold">Download</div>
                                        <div class="text-xs font-bold text-green-400 mt-1" x-text="formatBytes(vnstatData?.monthly?.total?.rx_bytes || 0)"></div>
                                    </div>
                                    <div class="bg-card/50 p-2.5 rounded-lg">
                                        <div class="text-[10px] text-gray-500 uppercase font-bold">Upload</div>
                                        <div class="text-xs font-bold text-purple-400 mt-1" x-text="formatBytes(vnstatData?.monthly?.total?.tx_bytes || 0)"></div>
                                    </div>
                                    <div class="bg-card/50 p-2.5 rounded-lg">
                                        <div class="text-[10px] text-gray-500 uppercase font-bold">Total</div>
                                        <div class="text-xs font-extrabold text-white mt-1" x-text="formatBytes(vnstatData?.monthly?.total?.total || 0)"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Per-Interface Traffic Table -->
                        <div class="space-y-2 font-mono">
                            <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Interface Statistics (WLAN vs LTE Mobile Data)</div>
                            <div class="bg-flat rounded-xl overflow-hidden text-xs">
                                <table class="w-full text-left border-collapse">
                                    <thead class="bg-gray-900/60 text-gray-400 border-b border-border">
                                        <tr>
                                            <th class="p-3">Interface</th>
                                            <th class="p-3">Type</th>
                                            <th class="p-3">Today (DL / UL)</th>
                                            <th class="p-3">Month (DL / UL)</th>
                                            <th class="p-3 text-right">Total Month</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-border/50 text-gray-300">
                                        <template x-for="item in vnstatInterfaceList" :key="item.name">
                                            <tr class="hover:bg-card/50 transition">
                                                <td class="p-3 font-bold text-white font-mono" x-text="item.name"></td>
                                                 <td class="p-3">
                                                     <span class="px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider"
                                                         :class="item.type.includes('WLAN') ? 'badge-info' : (item.type.includes('LTE') ? 'badge-active' : 'badge-neutral')"
                                                         x-text="item.type">
                                                     </span>
                                                 </td>
                                                <td class="p-3">
                                                    <span class="text-green-400 font-semibold" x-text="formatBytes(item.dailyRx)"></span>
                                                    <span class="text-gray-500"> / </span>
                                                    <span class="text-purple-400 font-semibold" x-text="formatBytes(item.dailyTx)"></span>
                                                </td>
                                                <td class="p-3">
                                                    <span class="text-green-400 font-semibold" x-text="formatBytes(item.monthlyRx)"></span>
                                                    <span class="text-gray-500"> / </span>
                                                    <span class="text-purple-400 font-semibold" x-text="formatBytes(item.monthlyTx)"></span>
                                                </td>
                                                <td class="p-3 text-right font-extrabold text-white" x-text="formatBytes(item.monthlyTotal)"></td>
                                            </tr>
                                        </template>
                                        <template x-if="vnstatInterfaceList.length === 0">
                                            <tr>

        <div class="bg-card border border-border rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Create New File</h3>
            <input type="text" x-model="newFileName" class="w-full bg-black border border-border rounded-xl p-3 text-xs text-white" placeholder="File Name (e.g. script.sh)" />
            <div class="flex justify-end space-x-3">
                <button type="button" @click="showFileModal = false" class="px-4 py-2 bg-black border border-border text-gray-300 rounded-xl text-xs font-semibold">Cancel</button>
                <button type="button" @click="createFile()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Create File</button>
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div x-show="showRenameModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 font-mono">
        <div class="bg-card border border-border rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Rename Item</h3>
            <div class="text-[10px] text-gray-400 truncate" x-text="'Renaming: ' + renameOldPath"></div>
            <input type="text" x-model="renameNewName" class="w-full bg-black border border-border rounded-xl p-3 text-xs text-white" placeholder="New Name" />
            <div class="flex justify-end space-x-3">
                <button type="button" @click="showRenameModal = false" class="px-4 py-2 bg-black border border-border text-gray-300 rounded-xl text-xs font-semibold">Cancel</button>
                <button type="button" @click="renamePath()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold font-mono">Rename</button>
            </div>
        </div>
    </div>

    <!-- Add Shortcut Modal -->
    <div x-show="showAddShortcutModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 font-mono">
        <div class="bg-card border border-border rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Add Custom Shortcut</h3>
            <div class="space-y-3">
                <div class="space-y-1">
                    <label for="sc-name" class="text-xs text-gray-400">Shortcut Name</label>
                    <input id="sc-name" type="text" x-model="newShortcutName" class="w-full bg-black border border-border rounded-xl px-3 py-2 text-xs text-white" placeholder="e.g. Modules" />
                </div>
                <div class="space-y-1">
                    <label for="sc-path" class="text-xs text-gray-400">Target Path</label>
                    <input id="sc-path" type="text" x-model="newShortcutPath" class="w-full bg-black border border-border rounded-xl px-3 py-2 text-xs text-white" placeholder="e.g. /data/adb/modules" />
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" @click="showAddShortcutModal = false" class="px-4 py-2 bg-black border border-border text-gray-300 rounded-xl text-xs font-semibold">Cancel</button>
                <button type="button" @click="saveShortcut()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Add Shortcut</button>
            </div>
        </div>
    </div>

    <!-- Neobrutalist Confirmation Modal -->
    <div x-show="confirmModal.show" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 font-mono">
        <div class="bg-card border border-border rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex items-center space-x-2 text-amber-500">
                <span class="text-lg">⚠️</span>
                <h3 class="text-sm font-bold text-white uppercase tracking-wider" x-text="confirmModal.title">Confirm Action</h3>
            </div>
            <p class="text-xs text-gray-300 leading-relaxed font-mono" x-text="confirmModal.message"></p>
            <div class="flex space-x-3 pt-2">
                <button type="button" @click="confirmModal.show = false" class="flex-1 bg-black border border-border text-gray-300 py-2 rounded-xl text-xs font-bold transition">Cancel</button>
                <button type="button" @click="confirmModal.onConfirm()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-500/20">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Floating Toast Notifications System Container -->
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none p-4" aria-live="polite">
        <template x-for="t in toasts" :key="t.id">
            <div class="bg-card border-2 border-border p-3.5 rounded-xl shadow-[4px_4px_0px_0px_var(--neo-shadow)] pointer-events-auto flex items-start justify-between gap-3 text-xs font-mono transition-all duration-300 transform translate-y-0 ease-out"
                 :class="t.type === 'success' ? 'border-green-500' : (t.type === 'error' ? 'border-red-500' : 'border-amber-500')">
                <!-- Status icon/badge -->
                <div class="flex items-center justify-center w-5 h-5 rounded-full font-bold select-none shrink-0"
                     :class="t.type === 'success' ? 'bg-green-500/10 text-green-500' : (t.type === 'error' ? 'bg-red-500/10 text-red-500' : 'bg-amber-500/10 text-amber-500')">
                    <span x-text="t.type === 'success' ? '✓' : (t.type === 'error' ? '✕' : 'ℹ')"></span>
                </div>
                <!-- Text payload -->
                <div class="flex-1 min-w-0">
                    <div class="font-extrabold text-white uppercase tracking-wider text-[10px]" x-text="t.title"></div>
                    <div class="text-gray-300 text-[10px] mt-0.5" x-text="t.message"></div>
                </div>
                <!-- Close dismissal button -->
                <button type="button" @click="removeToast(t.id)" class="text-gray-400 hover:text-white font-extrabold text-base leading-none select-none focus:outline-none shrink-0" aria-label="Dismiss toast">
                    ✕
                </button>
            </div>
        </template>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
