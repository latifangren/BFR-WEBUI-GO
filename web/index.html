<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFR WEBUI GO</title>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
        } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        }
        const uiStyle = localStorage.getItem('uiStyle') || 'neobrutal';
        document.documentElement.setAttribute('data-ui-style', uiStyle);
    </script>
    <link rel="stylesheet" href="/static/css/tailwind.min.css" />
    <link rel="stylesheet" href="/static/css/xterm.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <script defer src="/static/js/alpine.min.js"></script>
    <script src="/static/js/xterm.js"></script>
    <script src="/static/js/xterm-addon-fit.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body class="bg-amoled text-gray-200 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white w-full max-w-full overflow-x-hidden"
      x-data="dashboard()" x-init="init()"
      @notify.window="showToast($event.detail.title || $event.detail.type || 'Notification', $event.detail.message || $event.detail.msg || '', $event.detail.type || 'info')">

    {{template "header.html" .}}

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 pt-6 pb-24 md:pb-6 space-y-6 overflow-x-hidden">
        <!-- Auth Modal/Form (Candidate 1: Neo-Brutalist Glassmorphism) -->
        <template x-if="!authenticated">
            <div class="max-w-md mx-auto my-12 bg-card/90 backdrop-blur-2xl border border-border/80 rounded-3xl p-8 shadow-2xl space-y-6 animate-fade-in">
                <!-- Header & Logo -->
                <div class="text-center space-y-3">
                    <div class="w-14 h-14 rounded-2xl bg-blue-600 mx-auto flex items-center justify-center font-black text-2xl text-white shadow-xl shadow-blue-500/30">
                        B
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold text-white tracking-wide flex items-center justify-center gap-2">
                            BFR WebUI <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] select-none" style="background-color: #f59e0b !important; color: #000000 !important; border: 1.5px solid #000000 !important;">PRO</span>
                        </h2>
                        <p class="text-xs text-gray-400 font-mono mt-1" x-text="stats.model ? stats.model + ' (Android ' + stats.android_ver + ')' : 'Android System WebUI'"></p>
                    </div>
                </div>

                <!-- Login Form -->
                <form @submit.prevent="login()" class="space-y-4">
                    <div class="space-y-1.5">
                        <label for="pwd" class="block text-xs font-bold uppercase tracking-wider text-gray-400 font-mono">Access Password</label>
                        <div class="relative">
                            <input id="pwd" 
                                :type="showPassword ? 'text' : 'password'" 
                                x-model="loginPassword" 
                                class="w-full bg-black/80 border border-border/80 rounded-xl pl-4 pr-11 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition placeholder-gray-600 font-mono" 
                                placeholder="Enter access password" 
                                required />
                            <button type="button" 
                                @click="showPassword = !showPassword" 
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition p-1 select-none" 
                                title="Toggle password visibility">
                                <svg x-show="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                                <svg x-show="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 014.122-.977c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Quick Auto-Fill / Custom Password Badge -->
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-gray-400 font-mono">Quick Access:</span>
                        <template x-if="isDefaultPass">
                            <button type="button" 
                                @click="loginPassword = 'bfr'" 
                                class="px-2.5 py-1 rounded-lg text-[10px] font-mono font-bold bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 border border-blue-500/30 transition active:scale-95 select-none">
                                Default: bfr (Tap to auto-fill)
                            </button>
                        </template>
                        <template x-if="!isDefaultPass">
                            <button type="button" 
                                @click="showToast('Password Changed', 'Password default (bfr) telah diubah. Silakan gunakan password baru Anda.', 'warning')" 
                                class="px-2.5 py-1 rounded-lg text-[10px] font-mono font-bold bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 border border-emerald-500/30 transition active:scale-95 select-none">
                                🔒 Password Kustom Aktif
                            </button>
                        </template>
                    </div>

                    <!-- Animated Error Alert -->
                    <template x-if="authError">
                        <div x-show="authError" class="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-mono flex items-center gap-2">
                            <span>⚠️</span>
                            <span x-text="authError"></span>
                        </div>
                    </template>

                    <!-- Submit Button -->
                    <button type="submit" 
                        :disabled="loggingIn" 
                        class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 select-none disabled:opacity-50">
                        <span x-show="!loggingIn">Sign In</span>
                        <span x-show="loggingIn" class="flex items-center gap-2" style="display: none;">
                            <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                            Authenticating...
                        </span>
                    </button>
                </form>

                <!-- Social & Community Links Footer -->
                <div class="space-y-3 pt-2">
                    <div class="relative py-2">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-border/60"></div></div>
                        <div class="relative flex justify-center text-[10px] uppercase font-mono tracking-wider"><span class="bg-card px-3 text-gray-500 font-bold">Connect & Community</span></div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <!-- Telegram Button -->
                        <a href="https://t.me/Latifan_id" target="_blank" rel="noopener noreferrer" 
                            class="p-2.5 rounded-xl bg-flat border border-border/60 text-gray-300 hover:text-white hover:border-sky-500/40 hover:bg-sky-500/10 transition flex items-center justify-center gap-1.5 text-xs font-mono font-semibold select-none">
                            <svg class="w-4 h-4 text-sky-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .54-1.43.53-.48-.01-1.4-.27-2.09-.49-.84-.27-1.51-.42-1.45-.89.03-.25.38-.51 1.07-.78 4.2-1.83 7.01-3.04 8.42-3.63 4.01-1.67 4.84-1.96 5.38-1.97.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.16-.04.29z"/>
                            </svg>
                            <span>Telegram</span>
                        </a>

                        <!-- Facebook Button -->
                        <a href="https://www.facebook.com/latifan.latifan.latifan.latif" target="_blank" rel="noopener noreferrer" 
                            class="p-2.5 rounded-xl bg-flat border border-border/60 text-gray-300 hover:text-white hover:border-blue-500/40 hover:bg-blue-500/10 transition flex items-center justify-center gap-1.5 text-xs font-mono font-semibold select-none">
                            <svg class="w-4 h-4 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.99 3.66 9.12 8.44 9.88v-6.99H7.9v-2.89h2.54V9.8c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.89h-2.34v6.99C18.34 21.12 22 16.99 22 12z"/>
                            </svg>
                            <span>Facebook</span>
                        </a>

                        <!-- GitHub Button -->
                        <a href="https://github.com/latifangren/BFR-WEBUI-GO" target="_blank" rel="noopener noreferrer" 
                            class="p-2.5 rounded-xl bg-flat border border-border/60 text-gray-300 hover:text-white hover:border-gray-500/40 hover:bg-white/5 transition flex items-center justify-center gap-1.5 text-xs font-mono font-semibold select-none">
                            <svg class="w-4 h-4 text-gray-200" fill="currentColor" viewBox="0 0 24 24">
                                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                            </svg>
                            <span>GitHub</span>
                        </a>
                    </div>
                </div>
            </div>
        </template>

                <template x-if="authenticated">
            <div class="space-y-6">
                {{template "tab_overview.html" .}}

                {{template "tab_network.html" .}}

                {{template "tab_qos.html" .}}

                {{template "tab_modem.html" .}}

                {{template "tab_tunnel.html" .}}

                {{template "tab_nas.html" .}}

                <template x-if="activeTab === 'speedtest'">
                    {{template "tab_speedtest.html" .}}
                </template>

                {{template "tab_proxy.html" .}}

                {{template "tab_filemanager.html" .}}

                {{template "tab_terminal.html" .}}

                {{template "tab_tools.html" .}}

                {{template "tab_sms.html" .}}

                {{template "tab_scrcpy.html" .}}
            </div>
        </template>

        {{template "tab_sysinfo.html" .}}

        {{template "tab_logs.html" .}}

        {{template "tab_about.html" .}}
    </main>

    {{template "modals.html" .}}

    <script src="/static/js/modules/common/common.js"></script>
    <script src="/static/js/modules/sysinfo/sysinfo.js"></script>
    <script src="/static/js/modules/network/network.js"></script>
    <script src="/static/js/modules/qos/qos.js"></script>
    <script src="/static/js/modules/modem/modem.js"></script>
    <script src="/static/js/modules/tunnel/tunnel.js"></script>
    <script src="/static/js/modules/nas/nas.js"></script>
    <script src="/static/js/modules/speedtest/speedtest.js"></script>
    <script src="/static/js/modules/backup/backup.js"></script>
    <script src="/static/js/modules/filemanager/filemanager.js"></script>
    <script src="/static/js/modules/proxy/proxy.js"></script>
    <script src="/static/js/modules/terminal/terminal.js"></script>
    <script src="/static/js/modules/hotspot/hotspot.js"></script>
    <script src="/static/js/modules/vnstat/vnstat.js"></script>
    <script src="/static/js/modules/charger/charger.js"></script>
    <script src="/static/js/modules/sms/sms.js"></script>
    <script src="/static/js/modules/scrcpy/scrcpy.js"></script>
    <script src="/static/js/modules/donation/donation.js"></script>
    <script src="/static/js/modules/ssh/ssh.js"></script>
    <script src="/static/js/modules/logs/logs.js"></script>
    <script src="/static/js/modules/tools/modules.js"></script>
    <script src="/static/js/modules/logs/logcat.js"></script>
    <script src="/static/js/modules/telegram/telegram.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
